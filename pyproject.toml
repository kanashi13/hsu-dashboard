[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hsu-dashboard"
version = "0.1.0"
description = "Unofficial, local-first student dashboard for the HSU Pooya portal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "playwright>=1.44",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
hsu-dashboard = "hsu_dashboard.cli:main"

[tool.setuptools.packages.find]
include = ["hsu_dashboard*"]

[tool.setuptools.package-data]
hsu_dashboard = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
